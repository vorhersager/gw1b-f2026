# Team 3, E1b: peak learning rate at 100M (V100, float32). 1B tokens = 10 tokens/parameter, as for every ladder size.
# Learning rates are set by team3/experiments/e1b_lr_100m.sh around the value extrapolated from E1.
extends: ../100m.yaml
model:
  dtype: float32
optim:
  warmup_steps: 250       # half the class recipe, so warmup stays the same share (6.6%) of the halved run
run:
  out_dir: ${GW1B_SCRATCH}/teams/team3/runs
  total_tokens: 1_000_000_000
  eval_seqs: 512

# Team 3, E1: optimizer tuning at 50M (V100, float32). 0.5B tokens = 10 tokens/parameter, the same ratio as the
# production run, so the ladder predicts it. (The first stage-1 sweep ran at 1B tokens, 20 tokens/parameter, under
# names without a token tag; it is kept as the data-axis comparison at 50M.)
# Sweep values (optim.name, optim.lr, optim.weight_decay, seeds) are set by team3/experiments/e1_tune_50m.sh.
extends: ../50m.yaml
model:
  dtype: float32          # identical precision for AdamW and Muon (V100s have no bf16 tensor cores)
optim:
  warmup_steps: 250       # half the class recipe, so warmup stays the same share (13%) of the halved run
run:
  out_dir: ${GW1B_SCRATCH}/teams/team3/runs
  total_tokens: 500_000_000
  eval_seqs: 512          # every run scored on the same 512 validation windows (about 1M tokens)

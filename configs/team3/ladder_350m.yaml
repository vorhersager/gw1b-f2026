# Team 3, E8: scale-ladder point at 350M (V100, float32). 3.5B tokens = 10 tokens/parameter, as for every ladder size.
# On V100s like the smaller sizes, so all ladder losses share one precision; A100 hours go to the production run.
# Learning rates are set by team3/experiments/e8_ladder_350m.sh from the 50M-100M-200M trend.
extends: ../350m.yaml
model:
  dtype: float32
optim:
  warmup_steps: 500       # half the class recipe, so warmup stays the same share (7.5%) of the halved run
run:
  out_dir: ${GW1B_SCRATCH}/teams/team3/runs
  total_tokens: 3_500_000_000
  eval_seqs: 512
  ckpt_every: 250           # ~4 h of training on 4 V100s: chained 1-day jobs lose at most that much at a time limit

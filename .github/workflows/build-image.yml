name: build-image
# Builds env/Dockerfile and publishes it to GHCR so Pegasus (which has no fakeroot) can pull it:
#   apptainer build gw1b.sif docker://ghcr.io/<owner>/gw1b-f2026:2026.09     (= gw1b-admin build)
# Run it from GitHub -> Actions -> build-image -> "Run workflow", or push a tag env-2026.09.
# After the first run, make the package PUBLIC once: GitHub profile -> Packages -> gw1b-f2026 ->
# Package settings -> Change visibility. Otherwise Pegasus needs `apptainer registry login` with a token.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "image tag (= GW1B_ENV_VERSION in gw1b.env)"
        default: "2026.09"
        required: true
      arm64:
        description: "also build the aarch64 image for the Grace Hopper (superChip) nodes (tag <version>-arm64; ~1 h under emulation)"
        type: boolean
        default: false
  push:
    tags: ["env-*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the image is ~7 GB; runners start with ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - name: Image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#env-}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: env
          file: env/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.version }}
            ghcr.io/${{ steps.tag.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=GW1B class environment (JAX 0.10 CUDA 12, Flax NNX, Optax, Orbax, lm-eval)
      - name: Import check
        run: docker run --rm ghcr.io/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.version }} python -c "import jax, flax, optax, orbax.checkpoint, sentencepiece, datasets, lm_eval; print('jax', jax.__version__, 'flax', flax.__version__)"
  image-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.arm64 }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
      - name: Image tag
        id: tag
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: env
          file: env/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.version }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=GW1B class environment, aarch64 build for the Pegasus GH200 nodes

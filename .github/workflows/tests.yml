name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU JAX + test tools, no CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.10.2" "flax==0.12.8" "optax==0.2.8" "orbax-checkpoint==0.12.6" \
                      "sentencepiece==0.2.2" numpy pyyaml safetensors ml_dtypes tensorboardX pyarrow tqdm pytest
      - name: Run the CPU test suite
        run: python -m pytest tests -q
      - name: Shell syntax check
        run: bash -n bin/gw1b bin/gw1b-admin bin/gw1b-exec activate.sh slurm/*.sh slurm/*.sbatch env/*.sh laptop/*.sh
